# ===== SERVER =====
server.port=8080

# ===== H2 DATABASE =====
# Why H2? No setup needed, free on Render, assignment explicitly allows it
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA/HIBERNATE =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create-drop: recreates schema on every start — fine for H2 in-memory
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===== H2 CONSOLE (disable in prod, useful for debugging locally) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== SESSION =====
# Default Spring session timeout: 30 minutes
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax